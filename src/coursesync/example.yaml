# coursesync configuration. Paths may use ~ and $VARS; relative paths are relative to `root`.
root: ~/Documents/Uni                 # one folder per course goes in here
semester_start: 2026-09-14            # Monday of week 1: recordings and files are named by semester week
state_dir: ~/.local/state/coursesync  # ledger of what was fetched, saved browser login, run reports
notify: true                          # desktop notification when something new arrives (notify-send)
auto_login: false                     # true: log in with what `coursesync autologin` stored, ETH login page only
videos: true                          # false: keep only transcripts. Also per course or per source. Uses the site's own
                                      # captions or Zoom transcript without fetching the video; only without those
                                      # is a video downloaded, transcribed if `transcribe` is on, then deleted

transcribe:                           # needs `pip install "coursesync[transcribe]"`
  enabled: false
  model: large-v3-turbo               # GPU; falls back to `medium` on CPU
  batch_size: 8                       # chunks at once on the GPU: lower it if it runs out of memory
  language: en

# Run a command after every run with new items; {manifest} is a JSON file listing them.
# on_new: "my-notes-tool import {manifest}"

courses:
  algo:
    name: Algorithms Lab
    folder: Algo                      # → <root>/Algo/Recordings, /Moodle, /Website …
    sources:
      - type: tobira                  # video.ethz.ch series page (your ETH login)
        path: /lectures/d-infk/2026/autumn/252-0000-00L
      - type: moodle                  # all files of a Moodle course (your ETH login)
        id: 12345
        names: title                  # optional: name files after their Moodle title (recitation-02.pdf)
    labels:                           # optional: week (and short name) from file names
      - match: 'lecture[-_ ]?0?(\d+)'
        week: '{1}'
        name: 'L{week:02}-slides'

  ml:
    folder: ML
    videos: false                     # this course: transcripts only
    semester_start: 2026-09-21        # optional: this course's own week 1
    layout:                           # optional: how this course is organized (all keys optional)
      recordings: Lectures            # folder for recordings, default Recordings
      recording_name: '{date}'        # {date} and {week:02} work, default L07
      past_exams: Exams               # folder in the course, default past_exams inside each source's folder
      number: [Slides]                # folders whose files get an NN- prefix, so they sort in course order
                                      # (`coursesync renumber` applies it to files you already have)
      sort:                           # first match on the file name wins, even for exams
        - match: 'slides|lecture'
          to: Slides
        - match: 'sheet|exercise'
          to: Exercises/Sheets
    sources:
      - type: web                     # every linked file on a page
        url: https://example.ethz.ch/teaching/ml
        match: '\.pdf$'               # which links (regex)
        netrc: ~/.config/coursesync/ml.netrc   # if the files need the course password: `coursesync login ml --host example.ethz.ch`
      - type: ethz_web                # a page on ethz.ch whose files need your ETH login
        url: https://example.ethz.ch/education/lectures/ml.html
        match: '/ml/.*\.(pdf|zip)$'
        check: https://ethz.ch/content/dam/ethz/…/lecture-01.pdf   # any protected file: tells if you're logged in
      - type: moodle_zoom             # Zoom recording links in a Moodle page's tables (lecture / tutorial tables)
        id: 23456
      - type: vis                     # past exams + community answers from Community Solutions (ETH login)
        site: https://exams.vis.ethz.ch   # or https://exams.vmp.ethz.ch
        category: MachineLearning     # the slug in the category's URL
        exclude: [HS24]               # exams whose PDFs you already have (answers are still fetched)
        answers: 2                    # top answers per question to keep (0 = no answers)
      - type: amiv                    # AMIV study documents (exams, summaries) for D-MAVT/D-ITET (AMIV login)
        lecture: '^Machine Learning$' # regex on the lecture name
        types: [exams, cheat sheets]

  sim:
    folder: Sim
    sources:
      - type: git                     # the course repository, cloned/pulled into <folder>/<dest>
        repo: git@gitlab.ethz.ch:sim_hs26/lecture.git
        dest: lecture
      - type: zoom_readme             # a repo whose README lists "[Week 03 (01.10.2026)](https://…zoom.us/rec/share/…)"
        repo: git@gitlab.ethz.ch:sim_hs26/recordings.git
